<!DOCTYPE html>
<!-- Define o tipo do documento como HTML5 -->
<html lang="pt-BR">
<!-- Define o idioma principal da página como Português do Brasil -->

<head>
    <!-- Define a codificação de caracteres para aceitar acentos e cedilha -->
    <meta charset="UTF-8">
    
    <!-- Garante que a página seja responsiva (se adapte a celulares e computadores) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece na aba do navegador -->
    <title>DhigoMoviesTV - Galeria Oficial</title>
    
    <!-- Importa a fonte moderna 'Poppins' do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Vincula o arquivo CSS externo que dará a estilização visual à página -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho principal da página -->
    <header>
        <!-- Nome do seu canal -->
        <h1>DhigoMoviesTV</h1>
        <!-- Subtítulo descritivo -->
        <p>Confira os tutoriais e vídeos oficiais do canal</p>
    </header>

    <!-- Conteúdo principal onde os cards serão renderizados -->
    <main>
        <!-- Container vazio onde o JavaScript vai inserir automaticamente a grade de vídeos -->
        <div class="video-grid" id="videoGrid"></div>
    </main>

    <!-- Rodapé da página -->
    <footer>
        <p>&copy; DhigoMoviesTV - Canal Oficial</p>
    </footer>

    <!-- Vincula o arquivo JavaScript externo que contém a lógica e a lista de vídeos -->
    <script src="script.js"></script>
</body>
</html>
